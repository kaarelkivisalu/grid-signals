name: CI

on:
    push:
        branches: [main, feat/electricity-forecasting]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Lint check (Ruff)
              uses: astral-sh/ruff-action@v3
            - name: Format check (Ruff)
              run: ruff format --check --diff

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
            - run: uv sync --frozen --group research
            - run: uv run pytest --tb=short --cov=grid_signals --cov-report=term-missing

    demo:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -f Dockerfile.demo -t grid-signals-demo:ci .
            - name: Browse built demo without network, database or API keys
              run: docker run --rm -i --network none --entrypoint python grid-signals-demo:ci < tests/demo_image_check.py
