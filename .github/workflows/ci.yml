name: CI

on:
    push:
        branches: [main, feat/electricity-forecasting]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
            - name: Lint and format checks (locked Ruff)
              run: bash scripts/check.sh lint

    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
            - run: bash scripts/check.sh test

    demo:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: Build and browse demo without network, database or API keys
              run: bash scripts/check.sh demo

    runner:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: Build runner and check saved models and recovery without provider access
              run: bash scripts/check.sh runner

    # Publish images after all checks pass, so the server pulls them instead of building.
    # compose.forecast.yaml selects one with GRID_SIGNALS_IMAGE_TAG=sha-<full commit>.
    images:
        if: github.event_name == 'push'
        needs: [lint, test, demo, runner]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: runner
                      dockerfile: Dockerfile.runner
                    - name: web
                      dockerfile: Dockerfile.demo
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/grid-signals-${{ matrix.name }}
                  tags: |
                      type=sha,format=long,prefix=sha-
                      type=ref,event=branch
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,scope=${{ matrix.name }},mode=max
