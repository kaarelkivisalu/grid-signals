[project]
name = "grid-signals"
version = "0.1.0"
description = "European day-ahead power forecasts and reproducible benchmarks"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2, <4",
    "entsoe-py==0.7.11",
    "httpx>=0.28",
    "anthropic>=0.86, <1",
    "pydantic>=2.12, <3",
    "pandas>=2.2, <3",
    "pyarrow>=18, <24",
    "streamlit>=1.45, <2",
    "plotly>=6.0, <7",
    "prefect>=3.0, <4",
    "ecmwf-opendata>=0.3.34",
    "earthkit>=1.0.0",
    "cdsapi>=0.7.7",
    "python-dotenv>=1.2.2",
    "ecmwf-datastores-client>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=9, <10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pandas-stubs>=2.2",
    "ruff>=0.9",
    "testcontainers[postgres]>=4, <5",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
]

research = [
    # experiment tracking
    "mlflow>=2.18",
    # modelling
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    # physics
    "pvlib>=0.11",
    "windpowerlib>=0.2",
    # geo / fleet registry
    "geopandas>=1.0",
    # scoring
    "scoringrules>=0.7",
    # storage & compute
    "duckdb>=1.1",
    "pyarrow>=18",
    "xarray>=2024.10",
    # io
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6",
    # exploration
    "matplotlib>=3.9",
    "jupyterlab>=4.3",
    # NOTE: `darts` is deliberately deferred to the Phase 4 spike -- it pulls torch
    # for its deep models and we do not yet know which extra we need.
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
grid-signals = "grid_signals.cli:main"

[build-system]
requires = ["uv_build>=0.11.2, <0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "research/tests"]
pythonpath = ["research/src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "C901",
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__
    "DOC201",
    "DOC402",
    "DOC501",
    "N999",
    "PLC0415",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLR6301",
    "RUF069",
    "S607",
    "S608",
    "T201",
    "TD",

    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # docstring-tab-indentation
    "D300",   # triple-single-quotes
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
    "Q004",   # unnecessary-escaped-quote
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma
    "E501",   # line-too-long
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# No __init__.py: it would collide with the root `tests` package at import time.
"research/tests/**" = ["S101", "PLR2004", "INP001"]
# Research code: `X`/`y`/`df` are the idiom, and long inline exception messages are
# not worth the workaround noise.
# PD013: `.stack` keeps the DatetimeIndex; `.melt` would require discarding it first.
# PD010: `.pivot` is deliberate -- `.pivot_table` would silently average duplicate
#        (valid_time, model) rows instead of raising, hiding a data bug.
"research/src/**" = ["N803", "N806", "PD901", "PD011", "PD013", "PD010", "TRY003", "EM101", "EM102", "S311"]
# Exploratory notebooks are not linted; anything promoted out of one lands in
# research/src/ where full lint applies.
"research/notebooks/**" = ["ALL"]
"scripts/**" = ["INP001"]
"**.ipynb" = ["ERA001", "F401", "PT018"]
"exercises.ipynb" = ["S101", "FIX"]

[tool.ruff.lint.isort]
# research/src is not on ruff's inferred src path, so name it explicitly.
known-first-party = ["grid_signals", "renewable_forecast"]

[tool.ruff.lint.flake8-import-conventions]
# `gpd` is the universal geopandas convention; ruff's preview default bans it.
banned-aliases = {}

[tool.ruff.lint.flake8-import-conventions.aliases]
geopandas = "gpd"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
