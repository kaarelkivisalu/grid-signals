[project]
name = "grid-signals"
version = "0.1.0"
description = "Nordic-Baltic Energy Intelligence Agent"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "entsoe-py>=0.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
