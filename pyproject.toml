[project]
name = "grid-signals"
version = "0.1.0"
description = "Nordic-Baltic Energy Intelligence Agent"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5, <1.6",
    "entsoe-py==0.7.11",
    "httpx>=0.28",
    "anthropic>=0.86, <1",
    "pydantic>=2.12, <3",
    "pandas>=2.2, <3",
    "streamlit>=1.45, <2",
    "plotly>=6.0, <7",
    "prefect>=3.0, <4",
]

[dependency-groups]
dev = [
    "pytest>=9, <10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pandas-stubs>=2.2",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
grid-signals = "grid_signals.cli:main"

[build-system]
requires = ["uv_build>=0.11.2, <0.12"]
build-backend = "uv_build"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
