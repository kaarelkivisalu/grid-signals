[project]
name = "grid-signals"
version = "0.1.0"
description = "European day-ahead power forecasts and reproducible benchmarks"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12, <3",
    "pandas>=2.2, <3",
    "numpy>=2, <3",
    "pyarrow>=18, <24",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
web = ["streamlit==1.55.0", "plotly==6.6.0"]
runner = [
    "entsoe-py==0.7.11",
    "httpx>=0.28",
    "prefect>=3.0, <4",
    "ecmwf-opendata>=0.3.34",
    "ecmwf-datastores-client>=0.5",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pvlib>=0.11",
    "windpowerlib>=0.2",
    "geopandas>=1.0",
    "scoringrules>=0.7",
    "xarray>=2024.10",
    "netcdf4>=1.7",
    "tenacity>=9.0",
    "pydantic-settings>=2.6",
]
dev = [
    {include-group = "web"},
    "pytest>=9, <10",
    "pytest-cov>=6.0",
    "pandas-stubs>=2.2",
    "ruff>=0.9",
]
research = [
    {include-group = "runner"},
    "mlflow>=2.18",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
grid-signals = "grid_signals.cli:main"

[build-system]
requires = ["uv_build>=0.11.2, <0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "research/tests"]

[tool.ruff]
target-version = "py312"


[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "C901",
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__
    "DOC201",
    "DOC402",
    "DOC501",
    "N999",
    "PLC0415",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLR6301",
    "RUF069",
    "S607",
    "S608",
    "T201",
    "TD",

    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # docstring-tab-indentation
    "D300",   # triple-single-quotes
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
    "Q004",   # unnecessary-escaped-quote
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma
    "E501",   # line-too-long
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]
# No __init__.py: it would collide with the root `tests` package at import time.
"research/tests/**" = ["S101", "PLR2004", "INP001"]
# Research code: `X`/`y`/`df` are the idiom, and long inline exception messages are
# not worth the workaround noise.
# PD013: `.stack` keeps the DatetimeIndex; `.melt` would require discarding it first.
# PD010: `.pivot` is deliberate -- `.pivot_table` would silently average duplicate
#        (valid_time, model) rows instead of raising, hiding a data bug.
"src/grid_signals/forecast/**" = ["N803", "N806", "PD901", "PD011", "PD013", "PD010", "TRY003", "EM101", "EM102", "S311"]
# Avoid incidental algorithm edits during the source consolidation.
"src/grid_signals/forecast/evaluation/splits.py" = ["RUF007"]
"src/grid_signals/forecast/models/conformal.py" = ["PLR6104", "RUF031"]
"scripts/**" = ["INP001"]

[tool.ruff.lint.isort]
known-first-party = ["grid_signals"]

[tool.ruff.lint.flake8-import-conventions]
# `gpd` is the universal geopandas convention; ruff's preview default bans it.
banned-aliases = {}

[tool.ruff.lint.flake8-import-conventions.aliases]
geopandas = "gpd"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
