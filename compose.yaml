services:
  streamlit:
    build: .
    command: uv run streamlit run src/grid_signals/app/main.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHAT_DAILY_LIMIT_USD: ${CHAT_DAILY_LIMIT_USD:-1.0}
    volumes:
      - grid-data:/app/data:ro
      - grid-briefings:/app/briefings:ro
    expose:
      - "8501"
    restart: unless-stopped

volumes:
  grid-data:
    external: true
  grid-briefings:
    external: true
