pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: morning-pipeline
    entrypoint: src/grid_signals/flows.py:morning_pipeline
    work_pool:
      name: grid-signals
    schedule:
      cron: "0 5 * * *"
      timezone: "Europe/Tallinn"

  - name: weather-update
    entrypoint: src/grid_signals/flows.py:weather_update
    work_pool:
      name: grid-signals
    schedule:
      cron: "0 */6 * * *"
      timezone: "UTC"

  - name: initial-seed
    entrypoint: src/grid_signals/flows.py:initial_seed
    work_pool:
      name: grid-signals
    parameters:
      days: 90
